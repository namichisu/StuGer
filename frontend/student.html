<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StuGer — Student Portal</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="app-layout">
    <!-- Top Navigation -->
    <header class="navbar">
      <div class="nav-container">
        <div class="nav-brand">
          <div class="brand-info">
            <div class="brand-name-row">
              <h1 class="brand-title">StuGer</h1>
              <span class="version-badge">Student</span>
            </div>
            <p class="brand-subtitle" id="userDisplayName">Signed in</p>
          </div>
        </div>

        <div class="nav-actions">
          <div class="system-status" id="systemStatusBadge" title="Server status">
            <span class="status-indicator-dot"></span>
            <span id="systemStatusText">Online</span>
          </div>

          <button id="btnLogout" class="btn btn-secondary" type="button" title="Sign out">
            Logout
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content: Student Personal Portal -->
    <main class="main-content">
      <div class="student-portal-card">
        <div class="portal-header">
          <div>
            <h2 class="portal-title">My Student Profile</h2>
            <p class="portal-subtitle">Personal enrollment and academic record</p>
          </div>

        </div>

        <!-- Student Profile Details -->
        <div id="studentPortalDetails">
          <div class="table-state-box">
            <div class="loader-spinner"></div>
            <span>Loading your academic profile...</span>
          </div>
        </div>


      </div>
    </main>
  </div>

  <!-- Floating Toast Notifications -->
  <div id="toastContainer" class="toast-stack" aria-live="polite"></div>

  <script src="js/student.js"></script>
</body>

</html>
